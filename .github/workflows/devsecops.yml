# AI Contribution Weight: [90%] AI Generated / [10%] Human Refactored
# DevSecOps pipeline: build/test -> Docker build -> Trivy (deps + image) -> Semgrep -> SonarQube.
# All security scanners are NON-BLOCKING in Assignment 1 (continue-on-error / exit-code 0).
#
# SUPPLY-CHAIN NOTE: in March 2026 the aquasecurity/trivy-action version tags were hijacked
# (CVE-2026-33634). This workflow therefore does NOT use that action. It runs the official
# Trivy container at v0.69.3 (a known-safe release). Pin it by digest once you look one up:
#   docker pull aquasec/trivy:0.69.3 && docker inspect --format '{{index .RepoDigests 0}}' aquasec/trivy:0.69.3
# Also pin the third-party actions below to full commit SHAs (Dependabot can maintain them).
name: devsecops

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.69.3
  IMAGE_NAME: peer-review-gateway:ci

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: npm audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-telemetry
          path: |
            npm-audit.json
            coverage/lcov.info

  docker-build:
    name: Docker build & Trivy image scan
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (multi-stage)
        run: docker build --target runtime -t "$IMAGE_NAME" .
      - name: Validate compose file
        run: docker compose config -q
      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 3000:3000 "$IMAGE_NAME"
          for i in $(seq 1 15); do curl -fs localhost:3000/health && break || sleep 2; done
          curl -fs localhost:3000/health
          docker rm -f smoke
      - name: Trivy image scan (non-blocking)
        continue-on-error: true
        run: |
          docker save "$IMAGE_NAME" -o image.tar
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/tmp/trivy \
            -v "$PWD":/work -w /work "$TRIVY_IMAGE" image --input image.tar \
            --format sarif --output trivy-image.sarif --exit-code 0
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-telemetry
          path: trivy-image.sarif

  trivy-deps:
    name: Trivy dependency & secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (non-blocking)
        continue-on-error: true
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/tmp/trivy \
            -v "$PWD":/work -w /work "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig \
            --format sarif --output trivy-fs.sarif --exit-code 0 .
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-telemetry
          path: trivy-fs.sarif

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - name: Semgrep scan (non-blocking)
        continue-on-error: true
        run: |
          semgrep scan --metrics=off \
            --config p/default --config p/typescript --config p/nodejs --config p/owasp-top-ten \
            --sarif-output=semgrep.sarif --json-output=semgrep.json src test
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-telemetry
          path: |
            semgrep.sarif
            semgrep.json

  sonarqube:
    name: SonarQube SAST
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: SonarQube scan (non-blocking)
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5
      - name: Skipped notice
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN not set - add SONAR_TOKEN (and SONAR_HOST_URL for self-hosted) repo secrets."

  report:
    name: Pipeline telemetry summary
    runs-on: ubuntu-latest
    if: always()
    needs: [build-test, docker-build, trivy-deps, semgrep, sonarqube]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: telemetry
      - name: Summarize findings
        run: |
          {
            echo "## DevSecOps telemetry"
            echo "| Scanner | Findings |"
            echo "|---|---|"
            for f in $(find telemetry -name '*.sarif'); do
              n=$(jq '[.runs[].results | length] | add // 0' "$f")
              echo "| $(basename "$f") | $n |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
