# Single-tenant stack for Domain 3 (no cross-service communication).
# The credentials below are LOCAL DEV ONLY placeholders.
services:
  app:
    build:
      context: .
      target: runtime
    image: peer-review-gateway:local
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://prg:prg_dev_password@db:5432/prg
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prg
      POSTGRES_PASSWORD: prg_dev_password
      POSTGRES_DB: prg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prg -d prg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
